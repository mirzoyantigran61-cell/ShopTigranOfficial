<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Shop Platform - Buy & Sell Houses, Cars, Everything</title>
    <meta name="description" content="Modern marketplace platform for buying and selling houses, cars, electronics, and services">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
        }
        
        /* Glassmorphism эффекты */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glass-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }
        
        /* Neon effects */
        .neon-text {
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
        }
        
        .neon-border {
            box-shadow: 0 0 10px #00ffff, inset 0 0 5px #00ffff;
        }
        
        /* Mobile bottom navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            z-index: 1000;
        }
        
        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .animate-slide-up {
            animation: slideUp 0.5s ease-out;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        .animate-pulse-slow {
            animation: pulse 2s infinite;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }
        
        /* Swipe gestures */
        .swipe-area {
            touch-action: pan-y;
        }
        
        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Mobile app style */
        .app-container {
            max-width: 430px;
            margin: 0 auto;
            background: #000;
            min-height: 100vh;
            position: relative;
        }
        
        /* Smooth transitions */
        .page-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Hover effects */
        .hover-scale {
            transition: transform 0.2s;
        }
        
        .hover-scale:hover {
            transform: scale(1.05);
        }
        
        /* Status bar для iOS стиля */
        .status-bar {
            padding-top: env(safe-area-inset-top);
        }
        
        /* Pull to refresh */
        .pull-to-refresh {
            transition: transform 0.3s;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Основной HTML структуры приложения -->
    <script>
        // DOM загружен
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            setupEventListeners();
            checkAuth();
        });
        
        // Глобальное состояние
        let state = {
            user: null,
            token: localStorage.getItem('token'),
            currentPage: 'home',
            posts: [],
            categories: [],
            isLoading: false,
            darkMode: true,
            language: 'ru'
        };
        
        // Рендер приложения
        function renderApp() {
            const root = document.getElementById('root');
            
            if (state.currentPage === 'login') {
                root.innerHTML = renderLoginPage();
            } else if (state.currentPage === 'register') {
                root.innerHTML = renderRegisterPage();
            } else {
                root.innerHTML = `
                    <div class="app-container">
                        <!-- Header -->
                        <div class="glass px-4 py-3 sticky top-0 z-50 status-bar">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-store text-2xl text-cyan-400 animate-pulse-slow"></i>
                                    <span class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                                        ShopPlatform
                                    </span>
                                </div>
                                <div class="flex gap-3">
                                    <button onclick="toggleTheme()" class="text-gray-300 hover:text-cyan-400">
                                        <i class="fas ${state.darkMode ? 'fa-sun' : 'fa-moon'} text-xl"></i>
                                    </button>
                                    <button onclick="changeLanguage()" class="text-gray-300 hover:text-cyan-400">
                                        <i class="fas fa-globe text-xl"></i>
                                    </button>
                                    ${state.user ? `
                                        <button onclick="showNotifications()" class="relative">
                                            <i class="fas fa-bell text-xl text-gray-300"></i>
                                            <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center">3</span>
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                        
                        <!-- Main Content -->
                        <div id="mainContent" class="pb-20">
                            ${state.currentPage === 'home' ? renderHomePage() : 
                              state.currentPage === 'marketplace' ? renderMarketplace() :
                              state.currentPage === 'profile' ? renderProfile() :
                              state.currentPage === 'create' ? renderCreatePost() :
                              state.currentPage === 'chat' ? renderChat() : renderHomePage()}
                        </div>
                        
                        <!-- Bottom Navigation -->
                        <div class="bottom-nav">
                            <div class="flex justify-around items-center">
                                ${renderBottomNav()}
                            </div>
                        </div>
                    </div>
                `;
            }
        }
        
        // Рендер страницы логина
        function renderLoginPage() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="glass-card p-8 w-full max-w-md animate-slide-up">
                        <div class="text-center mb-8">
                            <i class="fas fa-store text-5xl text-cyan-400 mb-4"></i>
                            <h2 class="text-3xl font-bold text-white mb-2">Welcome Back!</h2>
                            <p class="text-gray-400">Sign in to continue</p>
                        </div>
                        
                        <form id="loginForm" class="space-y-4">
                            <div>
                                <label class="text-gray-300 text-sm mb-1 block">Email</label>
                                <div class="relative">
                                    <i class="fas fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                    <input type="email" id="email" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-cyan-400 transition">
                                </div>
                            </div>
                            
                            <div>
                                <label class="text-gray-300 text-sm mb-1 block">Password</label>
                                <div class="relative">
                                    <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                    <input type="password" id="password" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-cyan-400 transition">
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center">
                                <label class="flex items-center gap-2">
                                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-white/20">
                                    <span class="text-sm text-gray-400">Remember me</span>
                                </label>
                                <a href="#" onclick="forgotPassword()" class="text-sm text-cyan-400 hover:text-cyan-300">Forgot Password?</a>
                            </div>
                            
                            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white py-3 rounded-xl font-semibold hover:shadow-lg hover:shadow-cyan-500/50 transition transform hover:scale-[1.02]">
                                Sign In
                            </button>
                        </form>
                        
                        <div class="mt-6 text-center">
                            <p class="text-gray-400">Don't have an account? 
                                <a href="#" onclick="switchToRegister()" class="text-cyan-400 hover:text-cyan-300 font-semibold">Sign Up</a>
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Рендер главной страницы
        function renderHomePage() {
            return `
                <div class="p-4 space-y-4">
                    <!-- Stories -->
                    <div class="overflow-x-auto scrollbar-hide">
                        <div class="flex gap-4">
                            ${renderStories()}
                        </div>
                    </div>
                    
                    <!-- Search Bar -->
                    <div class="relative">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="Search houses, cars, electronics..." 
                               class="w-full bg-white/10 border border-white/20 rounded-xl py-3 pl-10 pr-12 text-white focus:outline-none focus:border-cyan-400">
                        <button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-cyan-400">
                            <i class="fas fa-sliders-h"></i>
                        </button>
                    </div>
                    
                    <!-- Categories -->
                    <div class="overflow-x-auto">
                        <div class="flex gap-3">
                            ${renderCategories()}
                        </div>
                    </div>
                    
                    <!-- Loading or Posts -->
                    ${state.isLoading ? renderSkeletons() : renderPosts()}
                </div>
            `;
        }
        
        // Рендер постов
        function renderPosts() {
            if (state.posts.length === 0) {
                return `
                    <div class="text-center py-12">
                        <i class="fas fa-store text-6xl text-gray-600 mb-4"></i>
                        <p class="text-gray-400">No posts yet. Be the first to sell!</p>
                        <button onclick="navigateTo('create')" class="mt-4 bg-cyan-500 text-white px-6 py-2 rounded-full">
                            Create Post
                        </button>
                    </div>
                `;
            }
            
            return state.posts.map(post => `
                <div class="glass-card p-4 animate-slide-up" onclick="viewPost('${post.id}')">
                    <div class="relative h-48 rounded-xl overflow-hidden mb-3">
                        <img src="${post.images[0] || 'https://via.placeholder.com/400x300'}" alt="${post.title}" class="w-full h-full object-cover">
                        <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-sm rounded-full px-2 py-1 text-xs">
                            <i class="fas fa-camera"></i> ${post.images.length}
                        </div>
                        <div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-sm rounded-full px-2 py-1 text-xs">
                            <i class="fas fa-eye"></i> ${post.views || 0}
                        </div>
                    </div>
                    
                    <h3 class="text-lg font-semibold text-white mb-1">${post.title}</h3>
                    <p class="text-2xl font-bold text-cyan-400 mb-2">$${post.price.toLocaleString()}</p>
                    
                    <div class="flex items-center gap-2 text-gray-400 text-sm mb-3">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>${post.location || 'Online'}</span>
                    </div>
                    
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 flex items-center justify-center">
                                <span class="text-white text-sm font-bold">${post.author?.username?.[0] || 'U'}</span>
                            </div>
                            <span class="text-sm text-gray-300">${post.author?.username || 'User'}</span>
                            ${post.author?.isVerified ? '<i class="fas fa-check-circle text-blue-500 text-xs"></i>' : ''}
                        </div>
                        
                        <div class="flex gap-3">
                            <button onclick="event.stopPropagation(); likePost('${post.id}')" class="flex items-center gap-1 text-gray-400 hover:text-red-500">
                                <i class="far fa-heart"></i>
                                <span class="text-sm">${post.likes || 0}</span>
                            </button>
                            <button class="flex items-center gap-1 text-gray-400">
                                <i class="far fa-comment"></i>
                                <span class="text-sm">${post.comments || 0}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Категории
        function renderCategories() {
            const categories = [
                { name: '🏠 Houses', icon: 'fa-home' },
                { name: '🚗 Cars', icon: 'fa-car' },
                { name: '📱 Electronics', icon: 'fa-mobile-alt' },
                { name: '💼 Services', icon: 'fa-briefcase' },
                { name: '👕 Fashion', icon: 'fa-tshirt' }
            ];
            
            return categories.map(cat => `
                <div class="flex flex-col items-center gap-2 cursor-pointer hover:scale-105 transition" onclick="filterByCategory('${cat.name}')">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 flex items-center justify-center">
                        <i class="fas ${cat.icon} text-2xl text-white"></i>
                    </div>
                    <span class="text-xs text-gray-300">${cat.name}</span>
                </div>
            `).join('');
        }
        
        // Stories
        function renderStories() {
            const stories = [1, 2, 3, 4, 5];
            return stories.map(() => `
                <div class="flex flex-col items-center gap-1">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 p-0.5">
                        <div class="w-full h-full rounded-full bg-gray-900 p-0.5">
                            <div class="w-full h-full rounded-full bg-gradient-to-br from-gray-700 to-gray-800"></div>
                        </div>
                    </div>
                    <span class="text-xs text-gray-400">User</span>
                </div>
            `).join('');
        }
        
        // Создание поста
        function renderCreatePost() {
            return `
                <div class="p-4">
                    <h2 class="text-2xl font-bold text-white mb-4">Create New Listing</h2>
                    
                    <form id="createPostForm" class="space-y-4">
                        <div>
                            <label class="text-gray-300 text-sm mb-1 block">Title</label>
                            <input type="text" id="postTitle" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400">
                        </div>
                        
                        <div>
                            <label class="text-gray-300 text-sm mb-1 block">Description</label>
                            <textarea id="postDesc" rows="4" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400"></textarea>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-gray-300 text-sm mb-1 block">Price</label>
                                <input type="number" id="postPrice" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="text-gray-300 text-sm mb-1 block">Category</label>
                                <select id="postCategory" class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400">
                                    <option value="houses">🏠 Houses</option>
                                    <option value="cars">🚗 Cars</option>
                                    <option value="electronics">📱 Electronics</option>
                                </select>
                            </div>
                        </div>
                        
                        <div>
                            <label class="text-gray-300 text-sm mb-1 block">Location</label>
                            <input type="text" id="postLocation" class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400">
                        </div>
                        
                        <div>
                            <label class="text-gray-300 text-sm mb-1 block">Images</label>
                            <div id="dropzone" class="border-2 border-dashed border-white/20 rounded-xl p-8 text-center cursor-pointer hover:border-cyan-400 transition">
                                <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-2"></i>
                                <p class="text-gray-400">Drag & drop images here or click to upload</p>
                                <input type="file" id="imageUpload" multiple accept="image/*" class="hidden">
                            </div>
                            <div id="imagePreview" class="grid grid-cols-3 gap-2 mt-2"></div>
                        </div>
                        
                        <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white py-3 rounded-xl font-semibold hover:shadow-lg transition">
                            <i class="fas fa-plus-circle"></i> Publish Listing
                        </button>
                    </form>
                </div>
            `;
        }
        
        // Чат
        function renderChat() {
            return `
                <div class="h-full flex flex-col">
                    <div class="p-4 border-b border-white/10">
                        <h2 class="text-xl font-bold text-white">Messages</h2>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-4 space-y-4" id="chatMessages">
                        <div class="text-center text-gray-400 py-12">
                            <i class="fas fa-comments text-5xl mb-3"></i>
                            <p>Select a chat to start messaging</p>
                        </div>
                    </div>
                    
                    <div class="p-4 border-t border-white/10">
                        <div class="flex gap-2">
                            <input type="text" placeholder="Type a message..." class="flex-1 bg-white/10 border border-white/20 rounded-xl py-2 px-4 text-white focus:outline-none focus:border-cyan-400">
                            <button class="bg-cyan-500 text-white px-4 rounded-xl hover:bg-cyan-600 transition">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Skeleton loading
        function renderSkeletons() {
            return [1, 2, 3].map(() => `
                <div class="glass-card p-4">
                    <div class="skeleton h-48 rounded-xl mb-3"></div>
                    <div class="skeleton h-6 w-3/4 mb-2"></div>
                    <div class="skeleton h-8 w-1/3 mb-2"></div>
                    <div class="skeleton h-4 w-1/2"></div>
                </div>
            `).join('');
        }
        
        // Bottom Navigation
        function renderBottomNav() {
            const navItems = [
                { id: 'home', icon: 'fa-home', label: 'Home' },
                { id: 'marketplace', icon: 'fa-store', label: 'Market' },
                { id: 'create', icon: 'fa-plus-circle', label: 'Sell' },
                { id: 'chat', icon: 'fa-comment', label: 'Chat' },
                { id: 'profile', icon: 'fa-user', label: 'Profile' }
            ];
            
            return navItems.map(item => `
                <button onclick="navigateTo('${item.id}')" class="flex flex-col items-center gap-1 group">
                    <i class="fas ${item.icon} text-xl ${state.currentPage === item.id ? 'text-cyan-400' : 'text-gray-400'} group-hover:text-cyan-400 transition"></i>
                    <span class="text-xs ${state.currentPage === item.id ? 'text-cyan-400' : 'text-gray-400'}">${item.label}</span>
                    ${state.currentPage === item.id ? '<div class="w-1 h-1 rounded-full bg-cyan-400 mt-1"></div>' : ''}
                </button>
            `).join('');
        }
        
        // Profile Page
        function renderProfile() {
            if (!state.user) {
                return `
                    <div class="p-8 text-center">
                        <i class="fas fa-user-circle text-6xl text-gray-600 mb-4"></i>
                        <p class="text-gray-400 mb-4">Please login to view your profile</p>
                        <button onclick="navigateTo('login')" class="bg-cyan-500 text-white px-6 py-2 rounded-full">
                            Login
                        </button>
                    </div>
                `;
            }
            
            return `
                <div class="relative">
                    <!-- Banner -->
                    <div class="h-32 bg-gradient-to-r from-cyan-500 to-blue-500"></div>
                    
                    <!-- Avatar -->
                    <div class="absolute -bottom-12 left-4">
                        <div class="w-24 h-24 rounded-full border-4 border-black bg-gradient-to-r from-cyan-400 to-blue-500 flex items-center justify-center">
                            <span class="text-4xl text-white font-bold">${state.user.username?.[0] || 'U'}</span>
                        </div>
                    </div>
                    
                    <!-- Edit Button -->
                    <div class="flex justify-end p-4">
                        <button onclick="editProfile()" class="glass px-4 py-2 rounded-full text-sm">
                            <i class="fas fa-pen"></i> Edit Profile
                        </button>
                    </div>
                    
                    <!-- User Info -->
                    <div class="p-4 pt-16">
                        <h2 class="text-2xl font-bold text-white">${state.user.username || 'User'}</h2>
                        ${state.user.isVerified ? '<span class="text-blue-400 text-sm"><i class="fas fa-check-circle"></i> Verified Seller</span>' : ''}
                        <p class="text-gray-400 mt-2">${state.user.bio || 'No bio yet'}</p>
                        
                        <div class="flex gap-4 mt-4">
                            <div class="text-center">
                                <div class="text-xl font-bold text-white">${state.user.postsCount || 0}</div>
                                <div class="text-xs text-gray-400">Posts</div>
                            </div>
                            <div class="text-center">
                                <div class="text-xl font-bold text-white">${state.user.followers || 0}</div>
                                <div class="text-xs text-gray-400">Followers</div>
                            </div>
                            <div class="text-center">
                                <div class="text-xl font-bold text-white">${state.user.following || 0}</div>
                                <div class="text-xs text-gray-400">Following</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Tabs -->
                    <div class="flex border-b border-white/10 mt-4">
                        <button onclick="showUserPosts()" class="flex-1 py-3 text-center ${state.userTab === 'posts' ? 'text-cyan-400 border-b-2 border-cyan-400' : 'text-gray-400'}">
                            Posts
                        </button>
                        <button onclick="showUserSaved()" class="flex-1 py-3 text-center ${state.userTab === 'saved' ? 'text-cyan-400 border-b-2 border-cyan-400' : 'text-gray-400'}">
                            Saved
                        </button>
                    </div>
                    
                    <div id="userContent" class="p-4">
                        ${renderUserPosts()}
                    </div>
                </div>
            `;
        }
        
        // Mock данные для демонстрации
        function loadMockData() {
            state.posts = [
                {
                    id: 1,
                    title: "Modern Villa with Pool",
                    price: 550000,
                    location: "Los Angeles, CA",
                    images: ["https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=400"],
                    likes: 45,
                    comments: 12,
                    views: 1234,
                    author: {
                        username: "luxuryhomes",
                        isVerified: true
                    }
                },
                {
                    id: 2,
                    title: "Tesla Model S 2023",
                    price: 89999,
                    location: "San Francisco, CA",
                    images: ["https://images.unsplash.com/photo-1617788138017-80ad40651399?w=400"],
                    likes: 89,
                    comments: 23,
                    views: 3456,
                    author: {
                        username: "teslamotors",
                        isVerified: true
                    }
                },
                {
                    id: 3,
                    title: "iPhone 15 Pro Max",
                    price: 1299,
                    location: "New York, NY",
                    images: ["https://images.unsplash.com/photo-1696446701796-da61225697cc?w=400"],
                    likes: 234,
                    comments: 45,
                    views: 7890,
                    author: {
                        username: "techstore",
                        isVerified: false
                    }
                }
            ];
            renderApp();
        }
        
        // Event Handlers
        function setupEventListeners() {
            // Login form
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    handleLogin(email, password);
                });
            }
            
            // Create post form
            const createPostForm = document.getElementById('createPostForm');
            if (createPostForm) {
                createPostForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    handleCreatePost();
                });
            }
            
            // Image upload dropzone
            const dropzone = document.getElementById('dropzone');
            if (dropzone) {
                dropzone.addEventListener('click', () => {
                    document.getElementById('imageUpload').click();
                });
                
                dropzone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropzone.classList.add('border-cyan-400');
                });
                
                dropzone.addEventListener('dragleave', () => {
                    dropzone.classList.remove('border-cyan-400');
                });
                
                dropzone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    handleImageUpload(e.dataTransfer.files);
                });
            }
            
            const imageUpload = document.getElementById('imageUpload');
            if (imageUpload) {
                imageUpload.addEventListener('change', (e) => {
                    handleImageUpload(e.target.files);
                });
            }
        }
        
        // Функции для работы с API
        async function handleLogin(email, password) {
            try {
                // Здесь должен быть реальный API запрос
                console.log('Login:', email, password);
                
                // Mock успешного входа
                state.user = {
                    username: 'John Doe',
                    email: email,
                    isVerified: true,
                    postsCount: 5,
                    followers: 123,
                    following: 45
                };
                state.token = 'mock-token';
                localStorage.setItem('token', state.token);
                state.currentPage = 'home';
                renderApp();
                
                showToast('Successfully logged in!', 'success');
            } catch (error) {
                showToast('Login failed', 'error');
            }
        }
        
        async function handleCreatePost() {
            const title = document.getElementById('postTitle').value;
            const description = document.getElementById('postDesc').value;
            const price = document.getElementById('postPrice').value;
            const category = document.getElementById('postCategory').value;
            const location = document.getElementById('postLocation').value;
            
            if (!title || !description || !price) {
                showToast('Please fill all required fields', 'error');
                return;
            }
            
            // Здесь должен быть API запрос
            console.log('Creating post:', { title, description, price, category, location });
            
            showToast('Post created successfully!', 'success');
            navigateTo('home');
        }
        
        function handleImageUpload(files) {
            const preview = document.getElementById('imagePreview');
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'w-full h-24 object-cover rounded-lg';
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }
        
        // Навигация
        function navigateTo(page) {
            state.currentPage = page;
            renderApp();
            
            // Анимация перехода
            const content = document.getElementById('mainContent');
            if (content) {
                content.style.animation = 'slideUp 0.3s ease-out';
            }
        }
        
        // Проверка авторизации
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                // Проверка токена через API
                state.token = token;
                // Загрузка данных пользователя
                loadMockData();
            } else {
                state.currentPage = 'login';
                renderApp();
            }
        }
        
        // Вспомогательные функции
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-20 left-4 right-4 glass p-4 rounded-xl text-center animate-slide-up z-50`;
            toast.style.background = type === 'success' ? 'rgba(0, 255, 0, 0.2)' : 'rgba(255, 0, 0, 0.2)';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        function toggleTheme() {
            state.darkMode = !state.darkMode;
            document.body.style.background = state.darkMode ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : '#f5f5f5';
            renderApp();
        }
        
        function changeLanguage() {
            state.language = state.language === 'ru' ? 'en' : 'ru';
            showToast(`Language changed to ${state.language === 'ru' ? 'Russian' : 'English'}`);
            renderApp();
        }
        
        function switchToRegister() {
            state.currentPage = 'register';
            renderApp();
        }
        
        function forgotPassword() {
            showToast('Password reset link sent to your email');
        }
        
        function likePost(postId) {
            console.log('Liked post:', postId);
            showToast('Post liked!');
        }
        
        function viewPost(postId) {
            showToast('Viewing post ' + postId);
        }
        
        function filterByCategory(category) {
            showToast(`Filtering by ${category}`);
        }
        
        function showNotifications() {
            showToast('You have 3 new notifications');
        }
        
        function editProfile() {
            showToast('Edit profile feature coming soon');
        }
        
        function showUserPosts() {
            state.userTab = 'posts';
            renderApp();
        }
        
        function showUserSaved() {
            state.userTab = 'saved';
            renderApp();
        }
        
        function renderUserPosts() {
            return '<p class="text-gray-400 text-center">Your posts will appear here</p>';
        }
        
        // Render Register Page
        function renderRegisterPage() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="glass-card p-8 w-full max-w-md animate-slide-up">
                        <div class="text-center mb-8">
                            <i class="fas fa-user-plus text-5xl text-cyan-400 mb-4"></i>
                            <h2 class="text-3xl font-bold text-white mb-2">Create Account</h2>
                            <p class="text-gray-400">Join our marketplace today</p>
                        </div>
                        
                        <form id="registerForm" class="space-y-4">
                            <div>
                                <label class="text-gray-300 text-sm mb-1 block">Username</label>
                                <input type="text" id="regUsername" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            
                            <div>
                                <label class="text-gray-300 text-sm mb-1 block">Email</label>
                                <input type="email" id="regEmail" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            
                            <div>
                                <label class="text-gray-300 text-sm mb-1 block">Password</label>
                                <input type="password" id="regPassword" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            
                            <div>
                                <label class="text-gray-300 text-sm mb-1 block">Confirm Password</label>
                                <input type="password" id="regConfirmPassword" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            
                            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white py-3 rounded-xl font-semibold hover:shadow-lg transition">
                                Sign Up
                            </button>
                        </form>
                        
                        <div class="mt-6 text-center">
                            <p class="text-gray-400">Already have an account? 
                                <a href="#" onclick="switchToLogin()" class="text-cyan-400 hover:text-cyan-300 font-semibold">Sign In</a>
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function switchToLogin() {
            state.currentPage = 'login';
            renderApp();
        }
        
        // Market page
        function renderMarketplace() {
            return `
                <div class="p-4">
                    <h2 class="text-2xl font-bold text-white mb-4">Marketplace</h2>
                    <div class="grid grid-cols-2 gap-4">
                        ${state.posts.map(post => `
                            <div class="glass-card p-2 cursor-pointer" onclick="viewPost('${post.id}')">
                                <div class="relative h-32 rounded-lg overflow-hidden mb-2">
                                    <img src="${post.images[0]}" alt="${post.title}" class="w-full h-full object-cover">
                                </div>
                                <h3 class="text-sm font-semibold text-white truncate">${post.title}</h3>
                                <p class="text-cyan-400 font-bold text-sm">$${post.price.toLocaleString()}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        // Инициализация приложения
        loadMockData();
    </script>
</body>
</html>
