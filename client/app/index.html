<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Shop Platform - Buy & Sell Houses, Cars, Everything</title>
    <!-- Добавьте эти стили в head -->
<style>
    /* Admin Panel Styles */
    .admin-sidebar {
        background: rgba(0, 0, 0, 0.95);
        backdrop-filter: blur(20px);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        transition: transform 0.3s ease;
    }
    
    .admin-stat-card {
        background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 0, 255, 0.1));
        border: 1px solid rgba(0, 255, 255, 0.3);
        transition: all 0.3s ease;
    }
    
    .admin-stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }
    
    .admin-table {
        width: 100%;
        border-collapse: collapse;
    }
    
    .admin-table th,
    .admin-table td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .admin-table th {
        background: rgba(0, 255, 255, 0.1);
        color: #00ffff;
        font-weight: 600;
    }
    
    .admin-table tr:hover {
        background: rgba(255, 255, 255, 0.05);
    }
    
    .ban-btn {
        background: rgba(255, 0, 0, 0.2);
        color: #ff4444;
        border: 1px solid #ff4444;
        padding: 4px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .ban-btn:hover {
        background: #ff4444;
        color: white;
    }
    
    .verify-btn {
        background: rgba(0, 255, 0, 0.2);
        color: #00ff00;
        border: 1px solid #00ff00;
        padding: 4px 12px;
        border-radius: 8px;
        cursor: pointer;
    }
    
    .delete-post-btn {
        background: rgba(255, 0, 0, 0.2);
        color: #ff4444;
        border: none;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
    }
    
    /* Модальное окно */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.9);
        z-index: 2000;
        backdrop-filter: blur(10px);
    }
    
    .modal-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-width: 500px;
        max-height: 80vh;
        overflow-y: auto;
    }
</style>

<script>
    // Admin credentials (в реальном приложении это должно быть на сервере!)
    const ADMIN_CREDENTIALS = {
        email: 'admin@shopplatform.com',
        password: 'Admin123!',
        username: 'SuperAdmin'
    };
    
    // Дополнительные админы (для демо)
    const ADDITIONAL_ADMINS = [
        { email: 'moderator@shopplatform.com', password: 'Moder123!', username: 'Moderator', role: 'moderator' },
        { email: 'owner@shopplatform.com', password: 'Owner123!', username: 'Owner', role: 'owner' }
    ];
    
    // Состояние админа
    let isAdminLoggedIn = false;
    let currentAdmin = null;
    let adminUsers = [];
    let adminPosts = [];
    let adminReports = [];
    let adminStats = {
        totalUsers: 1543,
        totalPosts: 892,
        totalReports: 23,
        activeUsers: 456,
        todaySales: 12340,
        pendingModeration: 12
    };
    
    // Функция входа в админку
    function loginAsAdmin(email, password) {
        // Проверяем главного админа
        if (email === ADMIN_CREDENTIALS.email && password === ADMIN_CREDENTIALS.password) {
            isAdminLoggedIn = true;
            currentAdmin = { ...ADMIN_CREDENTIALS, role: 'super_admin' };
            localStorage.setItem('adminToken', 'admin-session-token');
            showAdminPanel();
            showToast('Welcome to Admin Panel, Super Admin!', 'success');
            return true;
        }
        
        // Проверяем дополнительных админов
        const additionalAdmin = ADDITIONAL_ADMINS.find(admin => admin.email === email && admin.password === password);
        if (additionalAdmin) {
            isAdminLoggedIn = true;
            currentAdmin = additionalAdmin;
            localStorage.setItem('adminToken', 'admin-session-token');
            showAdminPanel();
            showToast(`Welcome ${additionalAdmin.role}!`, 'success');
            return true;
        }
        
        showToast('Invalid admin credentials!', 'error');
        return false;
    }
    
    // Показать админ панель
    function showAdminPanel() {
        state.currentPage = 'admin';
        renderAdminPanel();
    }
    
    // Рендер админ панели
    function renderAdminPanel() {
        const root = document.getElementById('root');
        root.innerHTML = `
            <div class="flex h-screen">
                <!-- Admin Sidebar -->
                <div class="admin-sidebar w-64 fixed left-0 top-0 bottom-0 overflow-y-auto">
                    <div class="p-6">
                        <div class="flex items-center gap-2 mb-8">
                            <i class="fas fa-crown text-2xl text-cyan-400"></i>
                            <span class="text-xl font-bold text-white">Admin Panel</span>
                        </div>
                        
                        <div class="space-y-2">
                            ${renderAdminMenu()}
                        </div>
                        
                        <div class="absolute bottom-6 left-6 right-6">
                            <button onclick="logoutAdmin()" class="w-full glass px-4 py-2 rounded-lg text-red-400 hover:text-red-300">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Admin Content -->
                <div class="ml-64 flex-1 p-8 overflow-y-auto">
                    <div class="mb-8">
                        <h1 class="text-3xl font-bold text-white mb-2">${getAdminPageTitle()}</h1>
                        <p class="text-gray-400">Welcome back, ${currentAdmin?.username} (${currentAdmin?.role})</p>
                    </div>
                    
                    <div id="adminContent">
                        ${renderAdminDashboard()}
                    </div>
                </div>
            </div>
        `;
        
        // Добавляем обработчики для админ меню
        setupAdminMenuHandlers();
    }
    
    // Рендер меню админа
    function renderAdminMenu() {
        const menuItems = [
            { id: 'dashboard', icon: 'fa-tachometer-alt', label: 'Dashboard', role: 'all' },
            { id: 'users', icon: 'fa-users', label: 'Users Management', role: 'all' },
            { id: 'posts', icon: 'fa-list', label: 'Posts Moderation', role: 'all' },
            { id: 'reports', icon: 'fa-flag', label: 'Reports', role: 'all' },
            { id: 'categories', icon: 'fa-tags', label: 'Categories', role: 'admin' },
            { id: 'settings', icon: 'fa-cog', label: 'Site Settings', role: 'owner' },
            { id: 'analytics', icon: 'fa-chart-line', label: 'Analytics', role: 'admin' },
            { id: 'announcements', icon: 'fa-bullhorn', label: 'Announcements', role: 'all' }
        ];
        
        return menuItems
            .filter(item => {
                if (item.role === 'all') return true;
                if (item.role === 'admin' && (currentAdmin?.role === 'admin' || currentAdmin?.role === 'super_admin' || currentAdmin?.role === 'owner')) return true;
                if (item.role === 'owner' && currentAdmin?.role === 'owner') return true;
                return false;
            })
            .map(item => `
                <button onclick="switchAdminPage('${item.id}')" class="admin-menu-item w-full text-left px-4 py-3 rounded-lg hover:bg-white/10 transition flex items-center gap-3" data-page="${item.id}">
                    <i class="fas ${item.icon} text-cyan-400"></i>
                    <span class="text-gray-300">${item.label}</span>
                </button>
            `).join('');
    }

                        </div>
                        <i class="fas fa-dollar-sign text-4xl text-cyan-400 opacity-50"></i>
                    </div>
                </div>
            </div>
            
            <!-- Recent Activity -->
            <div class="glass-card rounded-xl p-6 mb-8">
                <h2 class="text-xl font-bold text-white mb-4">Recent Activity</h2>
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-3 bg-white/5 rounded-lg">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-user-plus text-green-400"></i>
                            <div>
                                <p class="text-white">New user registered: johndoe123</p>
                                <p class="text-xs text-gray-400">2 minutes ago</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-white/5 rounded-lg">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-plus-circle text-blue-400"></i>
                            <div>
                                <p class="text-white">New listing: Tesla Model S</p>
                                <p class="text-xs text-gray-400">15 minutes ago</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-white/5 rounded-lg">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-flag text-red-400"></i>
                            <div>
                                <p class="text-white">New report on post #892</p>
                                <p class="text-xs text-gray-400">1 hour ago</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="glass-card rounded-xl p-6">
                <h2 class="text-xl font-bold text-white mb-4">Quick Actions</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <button onclick="openCreateAnnouncement()" class="p-4 bg-cyan-500/20 rounded-lg hover:bg-cyan-500/30 transition">
                        <i class="fas fa-bullhorn text-2xl text-cyan-400 mb-2"></i>
                        <p class="text-white text-sm">Announcement</p>
                    </button>
                    <button onclick="switchAdminPage('users')" class="p-4 bg-green-500/20 rounded-lg hover:bg-green-500/30 transition">
                        <i class="fas fa-user-shield text-2xl text-green-400 mb-2"></i>
                        <p class="text-white text-sm">Manage Users</p>
                    </button>
                    <button onclick="switchAdminPage('posts')" class="p-4 bg-yellow-500/20 rounded-lg hover:bg-yellow-500/30 transition">
                        <i class="fas fa-clipboard-list text-2xl text-yellow-400 mb-2"></i>
                        <p class="text-white text-sm">Moderate Posts</p>
                    </button>
                    <button onclick="exportData()" class="p-4 bg-purple-500/20 rounded-lg hover:bg-purple-500/30 transition">
                        <i class="fas fa-download text-2xl text-purple-400 mb-2"></i>
                        <p class="text-white text-sm">Export Data</p>
                    </button>
                </div>
            </div>
        `;
    }
    
    // Рендер управления пользователями
    function renderAdminUsers() {
        // Mock users data
        const users = [
            { id: 1, username: 'john_doe', email: 'john@example.com', role: 'user', status: 'active', posts: 12, joined: '2024-01-15' },

    // Рендер модерации постов
    function renderAdminPosts() {
        const posts = [
            { id: 1, title: 'Luxury Villa', author: 'john_doe', price: 550000, status: 'pending', reports: 0, created: '2024-03-15' },
            { id: 2, title: 'iPhone 15 Pro', author: 'spam_user', price: 1299, status: 'reported', reports: 5, created: '2024-03-14' },

        ];
        
        return `
            <div class="glass-card rounded-xl p-6">
                <h2 class="text-xl font-bold text-white mb-6">Posts Moderation</h2>
                
                <div class="overflow-x-auto">

                        <thead>
                            <tr>
                                <th>ID</th>

    // Функции управления
    function banUser(userId) {
        showToast(`User ${userId} has been banned`, 'warning');
        // Здесь реальная логика бана
    }
    
    function verifyUser(userId) {
        showToast(`User ${userId} has been verified`, 'success');
    }
    
    function deleteUser(userId) {
        if (confirm('Are you sure you want to delete this user?')) {
            showToast(`User ${userId} deleted`, 'error');
        }
    }
    
    function approvePost(postId) {
        showToast(`Post #${postId} approved`, 'success');
    }
    
    function deletePost(postId) {
        if (confirm('Delete this post?')) {
            showToast(`Post #${postId} deleted`, 'error');
        }
    }
    
    function pinPost(postId) {
        showToast(`Post #${postId} pinned to top`, 'success');
    }
    
    function openCreateAnnouncement() {
        showModal(`
            <div class="glass-card p-6">
                <h3 class="text-xl font-bold text-white mb-4">Create Announcement</h3>
                <input type="text" placeholder="Title" id="announceTitle" class="w-full bg-white/10 border border-white/20 rounded-lg p-3 mb-3 text-white">
                <textarea placeholder="Message" id="announceMessage" rows="4" class="w-full bg-white/10 border border-white/20 rounded-lg p-3 mb-3 text-white"></textarea>
                <select id="announceTarget" class="w-full bg-white/10 border border-white/20 rounded-lg p-3 mb-3 text-white">
                    <option value="all">All Users</option>
                    <option value="verified">Verified Only</option>
                    <option value="new">New Users</option>
                </select>
                <div class="flex gap-3">
                    <button onclick="sendAnnouncement()" class="flex-1 bg-cyan-500 text-white py-2 rounded-lg">Send</button>
                    <button onclick="closeModal()" class="flex-1 bg-red-500/20 text-red-400 py-2 rounded-lg">Cancel</button>
                </div>
            </div>
        `);
    }
    
    function sendAnnouncement() {
        const title = document.getElementById('announceTitle')?.value;
        const message = document.getElementById('announceMessage')?.value;
        if (title && message) {
            showToast(`Announcement sent: ${title}`, 'success');
            closeModal();
        }
    }
    
    function exportData() {
        showToast('Exporting data... (CSV will be downloaded)', 'info');
        // Здесь логика экспорта
    }
    
    function searchUsers() {
        const searchTerm = document.getElementById('searchUsers')?.value;
        showToast(`Searching for: ${searchTerm}`, 'info');
    }
    
    function logoutAdmin() {
        isAdminLoggedIn = false;
        currentAdmin = null;
        localStorage.removeItem('adminToken');
        state.currentPage = 'home';
        renderApp();
        showToast('Logged out from Admin Panel', 'info');
    }
    
    function getAdminPageTitle() {
        const titles = {
            dashboard: 'Dashboard',
            users: 'User Management',
            posts: 'Posts Moderation',
            reports: 'Reports & Flags',
            categories: 'Categories Management',
            settings: 'Site Settings',
            analytics: 'Analytics',
            announcements: 'Announcements'
        };
        return titles[state.adminPage] || 'Dashboard';
    }
    
    function switchAdminPage(page) {
        state.adminPage = page;
        const content = document.getElementById('adminContent');
        
        switch(page) {
            case 'dashboard':
                content.innerHTML = renderAdminDashboard();
                break;
            case 'users':
                content.innerHTML = renderAdminUsers();
                break;
            case 'posts':
                content.innerHTML = renderAdminPosts();
                break;
            case 'reports':
                content.innerHTML = renderAdminReports();
                break;
            case 'categories':
                content.innerHTML = renderAdminCategories();
                break;
            case 'settings':
                content.innerHTML = renderAdminSettings();
                break;
            case 'analytics':
                content.innerHTML = renderAdminAnalytics();
                break;
            case 'announcements':
                content.innerHTML = renderAdminAnnouncements();
                break;
        }
    }

                        <div class="flex justify-between items-start">
                            <div>

                                <p class="text-gray-400 text-sm">Reported by: john_doe • Post: "Suspicious Deal"</p>
                                <p class="text-gray-400 text-sm mt-2">Reason: "This user is posting spam and scam links"</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="resolveReport(234)" class="bg-green-500 px-3 py-1 rounded">Resolve</button>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

    function renderAdminCategories() {
        const categories = ['Houses', 'Cars', 'Electronics', 'Fashion', 'Services', 'Furniture'];

                    <div class="flex gap-2">

                        <button onclick="addCategory()" class="bg-cyan-500 px-6 rounded-lg">Add</button>

                <div class="grid grid-cols-2 gap-3">
                    ${categories.map(cat => `
                        <div class="flex justify-between items-center p-3 bg-white/5 rounded-lg">
                            <span class="text-white">${cat}</span>
                            <button onclick="deleteCategory('${cat}')" class="text-red-400">

                            </button>
                        </div>

                </div>
            </div>
        `;

    function renderAdminSettings() {

    function renderAdminAnalytics() {
        return `
            <div class="grid grid-cols-2 gap-6">
                <div class="glass-card rounded-xl p-6">
                    <h3 class="text-lg font-bold text-white mb-4">User Growth</h3>

    function renderAdminAnnouncements() {
        return `

                    </div>
                </div>
            </div>
        `;

    // Добавляем кнопку входа в админку на главной странице
    function addAdminLoginButton() {
        const header = document.querySelector('.glass .flex.justify-between');
        if (header) {
            const adminBtn = document.createElement('button');
            adminBtn.innerHTML = '<i class="fas fa-crown text-yellow-400"></i>';
            adminBtn.className = 'text-gray-300 hover:text-yellow-400 transition';
            adminBtn.onclick = () => showAdminLoginModal();
            header.appendChild(adminBtn);
        }
    }
    
    // Модальное окно для входа в админку
    function showAdminLoginModal() {
        showModal(`
            <div class="glass-card p-8">
                <div class="text-center mb-6">
                    <i class="fas fa-crown text-5xl text-yellow-400 mb-3"></i>
                    <h2 class="text-2xl font-bold text-white">Admin Access</h2>
                    <p class="text-gray-400">Enter admin credentials</p>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-gray-300 text-sm mb-1 block">Email</label>
                        <input type="email" id="adminEmail" placeholder="admin@shopplatform.com" class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white">
                    </div>
                    
                    <div>
                        <label class="text-gray-300 text-sm mb-1 block">Password</label>
                        <input type="password" id="adminPassword" placeholder="••••••" class="w-full bg-white/10 border border-white/20 rounded-xl py-3 px-4 text-white">
                    </div>
                    
                    <div class="bg-yellow-500/10 border border-yellow-500/30 rounded-lg p-3 text-sm">
                        <p class="text-yellow-400"><i class="fas fa-info-circle"></i> Demo Credentials:</p>
                        <p class="text-gray-300 text-xs mt-1">Email: admin@shopplatform.com<br>Password: Admin123!</p>
                    </div>
                    
                    <button onclick="submitAdminLogin()" class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-white py-3 rounded-xl font-semibold">
                        <i class="fas fa-sign-in-alt"></i> Login as Admin
                    </button>
                </div>
            </div>
        `);
    }
    
    function submitAdminLogin() {
        const email = document.getElementById('adminEmail')?.value;
        const password = document.getElementById('adminPassword')?.value;
        
        if (email && password) {
            loginAsAdmin(email, password);
            closeModal();
        } else {
            showToast('Please enter both email and password', 'error');
        }
    }
    
    function showModal(content) {
        let modal = document.getElementById('adminModal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'adminModal';
            modal.className = 'modal';
            document.body.appendChild(modal);
        }
        
        modal.innerHTML = `
            <div class="modal-content">
                ${content}
            </div>
        `;
        
        modal.style.display = 'block';
        
        // Close on click outside
        modal.onclick = (e) => {
            if (e.target === modal) closeModal();
        };
    }
    
    function closeModal() {
        const modal = document.getElementById('adminModal');
        if (modal) modal.style.display = 'none';
    }
    
    // Добавляем обработчики для админ меню
    function setupAdminMenuHandlers() {
        // Highlight active menu item
        const currentPage = state.adminPage || 'dashboard';
        document.querySelectorAll('.admin-menu-item').forEach(item => {
            if (item.dataset.page === currentPage) {
                item.classList.add('bg-cyan-500/20', 'border-l-4', 'border-cyan-400');
            }
        });
    }
    
    // Проверяем сохраненную сессию админа
    function checkAdminSession() {
        const adminToken = localStorage.getItem('adminToken');
        if (adminToken && state.currentPage === 'admin') {
            isAdminLoggedIn = true;
            currentAdmin = ADMIN_CREDENTIALS;
            showAdminPanel();
        }
    }
    
    // Сохраняем функции в глобальный объект
    window.loginAsAdmin = loginAsAdmin;
    window.showAdminPanel = showAdminPanel;
    window.switchAdminPage = switchAdminPage;
    window.banUser = banUser;
    window.verifyUser = verifyUser;
    window.deleteUser = deleteUser;
    window.approvePost = approvePost;
    window.deletePost = deletePost;
    window.pinPost = pinPost;
    window.openCreateAnnouncement = openCreateAnnouncement;
    window.sendAnnouncement = sendAnnouncement;
    window.exportData = exportData;
    window.searchUsers = searchUsers;
    window.logoutAdmin = logoutAdmin;
    window.addCategory = addCategory;
    window.deleteCategory = deleteCategory;
    window.saveSettings = saveSettings;
    window.resolveReport = resolveReport;
    window.deleteReportedPost = deleteReportedPost;
    window.showAdminLoginModal = showAdminLoginModal;
    window.submitAdminLogin = submitAdminLogin;
    window.closeModal = closeModal;
    
    function addCategory() {
        const newCat = document.getElementById('newCategory')?.value;
        if (newCat) {
            showToast(`Category "${newCat}" added`, 'success');
            switchAdminPage('categories');
        }
    }
    
    function deleteCategory(cat) {
        if (confirm(`Delete category "${cat}"?`)) {
            showToast(`Category "${cat}" deleted`, 'error');
        }
    }
    
    function saveSettings() {
        showToast('Settings saved successfully!', 'success');
    }
    
    function resolveReport(reportId) {
        showToast(`Report #${reportId} resolved`, 'success');
    }
    
    function deleteReportedPost(postId) {
        showToast(`Reported post #${postId} deleted`, 'error');
    }
    
    // Добавляем кнопку админа после загрузки страницы
    setTimeout(() => {
        addAdminLoginButton();
        checkAdminSession();
    }, 100);
</script>

<body>
    <div id="root"></div>
    
    <!-- Основной HTML структуры приложения -->
    <script>
        // DOM загружен
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            setupEventListeners();
            checkAuth();
        });
        
        // Глобальное состояние
        let state = {
            user: null,
            token: localStorage.getItem('token'),
            currentPage: 'home',
            posts: [],
            categories: [],
            isLoading: false,
            darkMode: true,
            language: 'ru'
        };
        
        // Рендер приложения
        function renderApp() {
            const root = document.getElementById('root');
            
            if (state.currentPage === 'login') {
                root.innerHTML = renderLoginPage();
            } else if (state.currentPage === 'register') {
                root.innerHTML = renderRegisterPage();
            } else {
                root.innerHTML = `
                    <div class="app-container">
                        <!-- Header -->
                        <div class="glass px-4 py-3 sticky top-0 z-50 status-bar">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-store text-2xl text-cyan-400 animate-pulse-slow"></i>
                                    <span class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                                        ShopPlatform
                                    </span>
                                </div>
                                <div class="flex gap-3">
                                    <button onclick="toggleTheme()" class="text-gray-300 hover:text-cyan-400">
                                        <i class="fas ${state.darkMode ? 'fa-sun' : 'fa-moon'} text-xl"></i>
                                    </button>
                                    <button onclick="changeLanguage()" class="text-gray-300 hover:text-cyan-400">
                                        <i class="fas fa-globe text-xl"></i>
                                    </button>
                                    ${state.user ? `
                                        <button onclick="showNotifications()" class="relative">
                                            <i class="fas fa-bell text-xl text-gray-300"></i>
                                            <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center">3</span>
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                        
                        <!-- Main Content -->
                        <div id="mainContent" class="pb-20">
                            ${state.currentPage === 'home' ? renderHomePage() : 
                              state.currentPage === 'marketplace' ? renderMarketplace() :
                              state.currentPage === 'profile' ? renderProfile() :
                              state.currentPage === 'create' ? renderCreatePost() :
                              state.currentPage === 'chat' ? renderChat() : renderHomePage()}
                        </div>
                        
                        <!-- Bottom Navigation -->
                        <div class="bottom-nav">
                            <div class="flex justify-around items-center">
                                ${renderBottomNav()}
                            </div>
                        </div>
                    </div>
                `;
            }
        }
        
        // Рендер страницы логина
        function renderLoginPage() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="glass-card p-8 w-full max-w-md animate-slide-up">
                        <div class="text-center mb-8">
                            <i class="fas fa-store text-5xl text-cyan-400 mb-4"></i>
                            <h2 class="text-3xl font-bold text-white mb-2">Welcome Back!</h2>
                            <p class="text-gray-400">Sign in to continue</p>
                        </div>
                        
                        <form id="loginForm" class="space-y-4">
                            <div>
                                <label class="text-gray-300 text-sm mb-1 block">Email</label>
                                <div class="relative">
                                    <i class="fas fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                    <input type="email" id="email" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-cyan-400 transition">
                                </div>
                            </div>
                            
                            <div>
                                <label class="text-gray-300 text-sm mb-1 block">Password</label>
                                <div class="relative">
                                    <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                    <input type="password" id="password" required class="w-full bg-white/10 border border-white/20 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-cyan-400 transition">
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center">
                                <label class="flex items-center gap-2">
                                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-white/20">
                                    <span class="text-sm text-gray-400">Remember me</span>
                                </label>
                                <a href="#" onclick="forgotPassword()" class="text-sm text-cyan-400 hover:text-cyan-300">Forgot Password?</a>
                            </div>
                            
                            <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white py-3 rounded-xl font-semibold hover:shadow-lg hover:shadow-cyan-500/50 transition transform hover:scale-[1.02]">
                                Sign In
                            </button>
                        </form>
                        
                        <div class="mt-6 text-center">
                            <p class="text-gray-400">Don't have an account? 
                                <a href="#" onclick="switchToRegister()" class="text-cyan-400 hover:text-cyan-300 font-semibold">Sign Up</a>
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Рендер главной страницы
        function renderHomePage() {
            return `
                <div class="p-4 space-y-4">
                    <!-- Stories -->
                    <div class="overflow-x-auto scrollbar-hide">
                        <div class="flex gap-4">
                            ${renderStories()}
                        </div>
                    </div>
                    
                    <!-- Search Bar -->

                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>

                    <!-- Categories -->

                        <div class="flex gap-3">

                    <!-- Loading or Posts -->
                    ${state.isLoading ? renderSkeletons() : renderPosts()}

        }
        
        // Рендер постов
        function renderPosts() {
            if (state.posts.length === 0) {
                return `
                    <div class="text-center py-12">
                        <i class="fas fa-store text-6xl text-gray-600 mb-4"></i>
                        <p class="text-gray-400">No posts yet. Be the first to sell!</p>

            }
            
            return state.posts.map(post => `
                <div class="glass-card p-4 animate-slide-up" onclick="viewPost('${post.id}')">

                        <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-sm rounded-full px-2 py-1 text-xs">
                            <i class="fas fa-camera"></i> ${post.images.length}

                        <div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-sm rounded-full px-2 py-1 text-xs">
                            <i class="fas fa-eye"></i> ${post.views || 0}

                    <h3 class="text-lg font-semibold text-white mb-1">${post.title}</h3>

                    <div class="flex items-center gap-2 text-gray-400 text-sm mb-3">

                            <span class="text-sm text-gray-300">${post.author?.username || 'User'}</span>
                            ${post.author?.isVerified ? '<i class="fas fa-check-circle text-blue-500 text-xs"></i>' : ''}

                        <div class="flex gap-3">
                            <button onclick="event.stopPropagation(); likePost('${post.id}')" class="flex items-center gap-1 text-gray-400 hover:text-red-500">

                                <span class="text-sm">${post.likes || 0}</span>
                            </button>
                            <button class="flex items-center gap-1 text-gray-400">
                                <i class="far fa-comment"></i>
                                <span class="text-sm">${post.comments || 0}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

        // Категории
        function renderCategories() {
            const categories = [
                { name: '🏠 Houses', icon: 'fa-home' },
                { name: '🚗 Cars', icon: 'fa-car' },
                { name: '📱 Electronics', icon: 'fa-mobile-alt' },
                { name: '💼 Services', icon: 'fa-briefcase' },
                { name: '👕 Fashion', icon: 'fa-tshirt' }

            return categories.map(cat => `
                <div class="flex flex-col items-center gap-2 cursor-pointer hover:scale-105 transition" onclick="filterByCategory('${cat.name}')">

                        <i class="fas ${cat.icon} text-2xl text-white"></i>
                    </div>
                    <span class="text-xs text-gray-300">${cat.name}</span>
                </div>
            `).join('');
        }
        
        // Stories
        function renderStories() {

        // Event Handlers
        function setupEventListeners() {
            // Login form
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    handleLogin(email, password);
                });
            }
            
            // Create post form
            const createPostForm = document.getElementById('createPostForm');
            if (createPostForm) {
                createPostForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    handleCreatePost();
                });
            }
            
            // Image upload dropzone
            const dropzone = document.getElementById('dropzone');
            if (dropzone) {
                dropzone.addEventListener('click', () => {
                    document.getElementById('imageUpload').click();
                });
                
                dropzone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropzone.classList.add('border-cyan-400');
                });
                
                dropzone.addEventListener('dragleave', () => {
                    dropzone.classList.remove('border-cyan-400');
                });
                
                dropzone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    handleImageUpload(e.dataTransfer.files);
                });
            }
            
            const imageUpload = document.getElementById('imageUpload');
            if (imageUpload) {
                imageUpload.addEventListener('change', (e) => {
                    handleImageUpload(e.target.files);
                });
            }
        }
        
        // Функции для работы с API
        async function handleLogin(email, password) {
            try {
                // Здесь должен быть реальный API запрос
                console.log('Login:', email, password);
                
                // Mock успешного входа
                state.user = {
                    username: 'John Doe',
                    email: email,
                    isVerified: true,
                    postsCount: 5,
                    followers: 123,
                    following: 45
                };
                state.token = 'mock-token';
                localStorage.setItem('token', state.token);
                state.currentPage = 'home';
                renderApp();
                
                showToast('Successfully logged in!', 'success');
            } catch (error) {
                showToast('Login failed', 'error');
            }
        }
        
        async function handleCreatePost() {
            const title = document.getElementById('postTitle').value;
            const description = document.getElementById('postDesc').value;
            const price = document.getElementById('postPrice').value;
            const category = document.getElementById('postCategory').value;
            const location = document.getElementById('postLocation').value;
            
            if (!title || !description || !price) {
                showToast('Please fill all required fields', 'error');
                return;
            }
            
            // Здесь должен быть API запрос
            console.log('Creating post:', { title, description, price, category, location });
            
            showToast('Post created successfully!', 'success');
            navigateTo('home');
        }
        
        function handleImageUpload(files) {
            const preview = document.getElementById('imagePreview');
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'w-full h-24 object-cover rounded-lg';
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }
        
        // Навигация
        function navigateTo(page) {
            state.currentPage = page;
            renderApp();
            
            // Анимация перехода
            const content = document.getElementById('mainContent');
            if (content) {
                content.style.animation = 'slideUp 0.3s ease-out';
            }
        }
        
        // Проверка авторизации
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                // Проверка токена через API
                state.token = token;
                // Загрузка данных пользователя
                loadMockData();
            } else {
                state.currentPage = 'login';
                renderApp();
            }
        }
        
        // Вспомогательные функции
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-20 left-4 right-4 glass p-4 rounded-xl text-center animate-slide-up z-50`;
            toast.style.background = type === 'success' ? 'rgba(0, 255, 0, 0.2)' : 'rgba(255, 0, 0, 0.2)';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        function toggleTheme() {
            state.darkMode = !state.darkMode;
            document.body.style.background = state.darkMode ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : '#f5f5f5';
            renderApp();
        }
        
        function changeLanguage() {
            state.language = state.language === 'ru' ? 'en' : 'ru';
            showToast(`Language changed to ${state.language === 'ru' ? 'Russian' : 'English'}`);
            renderApp();
        }

            state.currentPage = 'register';
            renderApp();
        }

        // Инициализация приложения
        loadMockData();
    </script>
